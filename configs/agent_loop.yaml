- name: shopping_tool_agent
  _target_: shopping_grpo.training.grpo.adapter.agent_loop.ShoppingToolAgentLoop
  base_url: ${oc.env:SHOPSIM_BASE_URL,http://127.0.0.1:5700}
  timeout: 60
  max_steps: 35
  reward_length_shaping_enable: ${oc.env:SHOPPING_LENGTH_SHAPING_ENABLE,false}
  reward_length_soft_threshold: ${oc.env:SHOPPING_SOFT_LENGTH_THRESHOLD,20}
  reward_length_penalty_per_step: ${oc.env:SHOPPING_LENGTH_PENALTY_PER_STEP,0.01}
  reward_length_max_penalty: ${oc.env:SHOPPING_MAX_LENGTH_PENALTY,0.15}
  required_environment_version: shopsimulator-environment-v2.1
  reward_mode: constraint_aware
  context_window_tokens: ${oc.env:SHOPPING_CONTEXT_WINDOW_TOKENS,24576}
  context_generation_reserve_tokens: ${oc.env:SHOPPING_CONTEXT_GENERATION_RESERVE_TOKENS,512}
  context_safety_margin_tokens: ${oc.env:SHOPPING_CONTEXT_SAFETY_MARGIN_TOKENS,512}
  context_input_budget_tokens: ${oc.env:SHOPPING_CONTEXT_INPUT_BUDGET_TOKENS,16384}
  context_preserve_recent_groups: 1
  context_compaction_enable: ${oc.env:SHOPPING_CONTEXT_COMPACTION_ENABLE,false}
  observation_token_budget: ${oc.env:SHOPPING_OBSERVATION_TOKEN_BUDGET,1536}
  observation_detail_token_budget: ${oc.env:SHOPPING_OBSERVATION_DETAIL_TOKEN_BUDGET,4096}
  observation_generic_token_budget: ${oc.env:SHOPPING_OBSERVATION_GENERIC_TOKEN_BUDGET,768}
  observation_search_top_k: ${oc.env:SHOPPING_OBSERVATION_SEARCH_TOP_K,20}
